<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg-pos" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3478f6"/><stop offset="1" stop-color="#1a5fd0"/>
    </linearGradient>
    <filter id="shadow-pos"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg-pos)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="60" fill="#0b1120"/>
  <circle cx="32" cy="30" r="14" fill="#3478f6"/>
  <rect x="58" y="22" width="120" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
  <rect x="1080" y="18" width="140" height="28" rx="14" fill="#1e293b"/>
  <text x="1160" y="37" font-size="13" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">City Branch</text>
  <rect x="500" y="20" width="280" height="28" rx="14" fill="#1e293b" opacity="0.7"/>
  <text x="650" y="38" font-size="13" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">Search products / barcode...</text>

  <!-- Left: products grid -->
  <g>
    <text x="32" y="95" font-size="16" font-weight="600" fill="#e2e8f0">Products</text>
    <g filter="url(#shadow-pos)">
      <!-- Row 1 -->
      <rect x="32" y="108" width="170" height="180" rx="14" fill="#1e293b"/>
      <rect x="32" y="108" width="170" height="100" rx="14" fill="#334155"/>
      <text x="42" y="180" font-size="32" fill="#cbd5e1" opacity="0.5">🍍</text>
      <text x="42" y="232" font-size="14" font-weight="600" fill="#e2e8f0">Coca-Cola 500ml</text>
      <text x="42" y="252" font-size="13" fill="#94a3b8">KSh 60 · Stock: 240</text>
      <rect x="32" y="258" width="170" height="30" rx="0" fill="transparent"/>

      <rect x="215" y="108" width="170" height="180" rx="14" fill="#1e293b"/>
      <rect x="215" y="108" width="170" height="100" rx="14" fill="#334155"/>
      <text x="225" y="225" font-size="14" font-weight="600" fill="#e2e8f0">Bread Loaf</text>
      <text x="225" y="245" font-size="13" fill="#94a3b8">KSh 55 · Stock: 42</text>

      <rect x="398" y="108" width="170" height="180" rx="14" fill="#1e293b"/>
      <rect x="398" y="108" width="170" height="100" rx="14" fill="#334155"/>
      <text x="408" y="225" font-size="14" font-weight="600" fill="#e2e8f0">Milk 1L</text>
      <text x="408" y="245" font-size="13" fill="#94a3b8">KSh 120 · Stock: 18</text>

      <rect x="581" y="108" width="170" height="180" rx="14" fill="#1e293b"/>
      <rect x="581" y="108" width="170" height="100" rx="14" fill="#334155"/>
      <text x="591" y="225" font-size="14" font-weight="600" fill="#e2e8f0">Sugar 1kg</text>
      <text x="591" y="245" font-size="13" fill="#94a3b8">KSh 210 · Stock: 87</text>

      <!-- Row 2 -->
      <rect x="32" y="304" width="170" height="180" rx="14" fill="#1e293b"/>
      <rect x="32" y="304" width="170" height="100" rx="14" fill="#334155"/>
      <text x="42" y="421" font-size="14" font-weight="600" fill="#e2e8f0">Rice 2kg</text>
      <text x="42" y="441" font-size="13" fill="#94a3b8">KSh 340 · Stock: 56</text>

      <rect x="215" y="304" width="170" height="180" rx="14" fill="#1e293b"/>
      <rect x="215" y="304" width="170" height="100" rx="14" fill="#334155"/>
      <text x="225" y="421" font-size="14" font-weight="600" fill="#e2e8f0">Tea Bags 100pk</text>
      <text x="225" y="441" font-size="13" fill="#94a3b8">KSh 180 · Stock: 31</text>

      <rect x="398" y="304" width="170" height="180" rx="14" fill="#1e293b"/>
      <rect x="398" y="304" width="170" height="100" rx="14" fill="#334155"/>
      <text x="408" y="421" font-size="14" font-weight="600" fill="#e2e8f0">Eggs (tray)</text>
      <text x="408" y="441" font-size="13" fill="#94a3b8">KSh 450 · Stock: 24</text>

      <rect x="581" y="304" width="170" height="180" rx="14" fill="#1e293b"/>
      <rect x="581" y="304" width="170" height="100" rx="14" fill="#334155"/>
      <text x="591" y="421" font-size="14" font-weight="600" fill="#e2e8f0">Cooking Oil 1L</text>
      <text x="591" y="441" font-size="13" fill="#94a3b8">KSh 260 · Stock: 73</text>
    </g>
  </g>

  <!-- Right: cart panel -->
  <g filter="url(#shadow-pos)">
    <rect x="785" y="80" width="463" height="610" rx="16" fill="#1e293b"/>
    <rect x="785" y="80" width="463" height="56" rx="16" fill="url(#accent)"/>
    <text x="810" y="115" font-size="18" font-weight="700" fill="#ffffff">Current Sale</text>
    <text x="1185" y="115" font-size="13" fill="#ffffff" opacity="0.85" text-anchor="end" dominant-baseline="middle">#1025</text>

    <!-- Cart items -->
    <g font-size="14" fill="#e2e8f0">
      <rect x="805" y="150" width="423" height="60" rx="10" fill="#0f172a" opacity="0.5"/>
      <text x="820" y="175">Coca-Cola 500ml</text>
      <text x="820" y="195" font-size="12" fill="#94a3b8">KSh 60 × 2</text>
      <text x="1212" y="185" text-anchor="end" font-weight="600">KSh 120</text>

      <rect x="805" y="220" width="423" height="60" rx="10" fill="#0f172a" opacity="0.5"/>
      <text x="820" y="245">Bread Loaf</text>
      <text x="820" y="265" font-size="12" fill="#94a3b8">KSh 55 × 1</text>
      <text x="1212" y="255" text-anchor="end" font-weight="600">KSh 55</text>

      <rect x="805" y="290" width="423" height="60" rx="10" fill="#0f172a" opacity="0.5"/>
      <text x="820" y="315">Sugar 1kg</text>
      <text x="820" y="335" font-size="12" fill="#94a3b8">KSh 210 × 1</text>
      <text x="1212" y="325" text-anchor="end" font-weight="600">KSh 210</text>

      <rect x="805" y="360" width="423" height="60" rx="10" fill="#0f172a" opacity="0.5"/>
      <text x="820" y="385">Milk 1L</text>
      <text x="820" y="405" font-size="12" fill="#94a3b8">KSh 120 × 3</text>
      <text x="1212" y="395" text-anchor="end" font-weight="600">KSh 360</text>
    </g>

    <!-- Totals -->
    <g font-size="14" fill="#94a3b8">
      <text x="810" y="470">Subtotal</text>
      <text x="1212" y="470" text-anchor="end" fill="#e2e8f0">KSh 745</text>
      <text x="810" y="500">Discount (5%)</text>
      <text x="1212" y="500" text-anchor="end" fill="#f59e0b">-KSh 37</text>
      <text x="810" y="530">Tax (16% VAT)</text>
      <text x="1212" y="530" text-anchor="end" fill="#e2e8f0">KSh 113</text>
      <line x1="810" y1="550" x2="1212" y2="550" stroke="#334155"/>
      <text x="810" y="580" font-size="18" font-weight="700" fill="#ffffff">Total</text>
      <text x="1212" y="580" text-anchor="end" font-size="22" font-weight="700" fill="#4cc2ff">KSh 821</text>
    </g>

    <!-- Payment buttons -->
    <rect x="805" y="600" width="130" height="44" rx="10" fill="#22c55e"/>
    <text x="870" y="628" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Cash</text>
    <rect x="945" y="600" width="130" height="44" rx="10" fill="#f59e0b"/>
    <text x="1010" y="628" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">M-Pesa</text>
    <rect x="1085" y="600" width="128" height="44" rx="10" fill="url(#accent)"/>
    <text x="1149" y="628" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Card</text>
  </g>
</svg>
