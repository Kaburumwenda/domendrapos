<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg-rpt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f3f3"/><stop offset="1" stop-color="#e8edf4"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3478f6" stop-opacity="0.4"/><stop offset="1" stop-color="#3478f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow-rpt"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg-rpt)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="720" fill="#ffffff" filter="url(#shadow-rpt)"/>
  <circle cx="34" cy="40" r="16" fill="#3478f6"/>
  <rect x="58" y="34" width="90" height="14" rx="7" fill="#1a1a1a"/>
  <g font-size="14" fill="#444">
    <rect x="16" y="160" width="188" height="42" rx="10" fill="#e8f1fe"/>
    <circle cx="40" cy="181" r="8" fill="#3478f6"/><text x="62" y="186">Reports</text>
    <text x="40" y="230">Sales Summary</text>
    <text x="40" y="265">Profit and Loss</text>
    <text x="40" y="300">VAT Report</text>
    <text x="40" y="335">Stock Valuation</text>
  </g>

  <!-- Topbar -->
  <rect x="220" y="0" width="1060" height="64" fill="#ffffff" filter="url(#shadow-rpt)"/>

  <text x="248" y="108" font-size="28" font-weight="700" fill="#0f172a">Sales Summary Report</text>
  <text x="248" y="135" font-size="15" fill="#64748b">Jan 1 – Jan 31, 2026 · All Branches</text>

  <!-- Period selector -->
  <g filter="url(#shadow-rpt)">
    <rect x="248" y="160" width="1000" height="56" rx="14" fill="#ffffff"/>
    <rect x="268" y="176" width="120" height="26" rx="8" fill="#f1f5f9"/>
    <text x="328" y="194" font-size="13" fill="#475569" text-anchor="middle">This Month</text>
    <text x="400" y="194" font-size="13" fill="#64748b">From: 01 Jan 2026</text>
    <text x="570" y="194" font-size="13" fill="#64748b">To: 31 Jan 2026</text>
    <rect x="700" y="176" width="120" height="26" rx="8" fill="#f1f5f9"/>
    <text x="760" y="194" font-size="13" fill="#475569" text-anchor="middle">All Branches</text>
    <rect x="1050" y="176" width="86" height="26" rx="8" fill="#22c55e"/>
    <text x="1093" y="194" font-size="12" fill="#ffffff" text-anchor="middle">Export CSV</text>
    <rect x="1146" y="176" width="86" height="26" rx="8" fill="#3478f6"/>
    <text x="1189" y="194" font-size="12" fill="#ffffff" text-anchor="middle">Export PDF</text>
  </g>

  <!-- KPIs -->
  <g filter="url(#shadow-rpt)">
    <rect x="248" y="236" width="240" height="100" rx="14" fill="#ffffff"/>
    <text x="268" y="266" font-size="13" fill="#64748b">Gross Revenue</text>
    <text x="268" y="303" font-size="24" font-weight="700" fill="#0f172a">KSh 2.48 M</text>

    <rect x="508" y="236" width="240" height="100" rx="14" fill="#ffffff"/>
    <text x="528" y="266" font-size="13" fill="#64748b">Net Profit</text>
    <text x="528" y="303" font-size="24" font-weight="700" fill="#16a34a">KSh 612 K</text>

    <rect x="768" y="236" width="240" height="100" rx="14" fill="#ffffff"/>
    <text x="788" y="266" font-size="13" fill="#64748b">Transactions</text>
    <text x="788" y="303" font-size="24" font-weight="700" fill="#0f172a">8,420</text>

    <rect x="1028" y="236" width="220" height="100" rx="14" fill="#ffffff"/>
    <text x="1048" y="266" font-size="13" fill="#64748b">Profit Margin</text>
    <text x="1048" y="303" font-size="24" font-weight="700" fill="#0f172a">24.7%</text>
  </g>

  <!-- Line chart -->
  <g filter="url(#shadow-rpt)">
    <rect x="248" y="356" width="760" height="260" rx="16" fill="#ffffff"/>
    <text x="276" y="386" font-size="16" font-weight="600" fill="#0f172a">Daily Sales Trend</text>
    <text x="276" y="404" font-size="12" fill="#64748b">Revenue (KSh) · 30 days</text>
    <!-- area -->
    <path d="M 276 580 L 276 520 L 320 490 L 364 510 L 408 460 L 452 470 L 496 430 L 540 450 L 584 410 L 628 450 L 672 400 L 716 420 L 760 380 L 804 410 L 848 370 L 892 400 L 936 360 L 980 400 L 980 580 Z" fill="url(#line-grad)"/>
    <path d="M 276 580 L 276 520 L 320 490 L 364 510 L 408 460 L 452 470 L 496 430 L 540 450 L 584 410 L 628 450 L 672 400 L 716 420 L 760 380 L 804 410 L 848 370 L 892 400 L 936 360 L 980 400" stroke="#3478f6" stroke-width="3" fill="none"/>
    <line x1="276" y1="580" x2="980" y2="580" stroke="#e2e8f0"/>
    <text x="276" y="600" font-size="11" fill="#94a3b8">Jan 1</text>
    <text x="980" y="600" font-size="11" fill="#94a3b8" text-anchor="end">Jan 30</text>
  </g>

  <!-- Right side breakdown -->
  <g filter="url(#shadow-rpt)">
    <rect x="1028" y="356" width="220" height="260" rx="16" fill="#ffffff"/>
    <text x="1050" y="386" font-size="15" font-weight="600" fill="#0f172a">By Payment</text>
    <g font-size="13" fill="#334155">
      <rect x="1050" y="410" width="12" height="12" rx="2" fill="#22c55e"/>
      <text x="1070" y="421">Cash</text>
      <text x="1228" y="421" text-anchor="end" fill="#475569">KSh 1.1 M</text>

      <rect x="1050" y="440" width="12" height="12" rx="2" fill="#f59e0b"/>
      <text x="1070" y="451">M-Pesa</text>
      <text x="1228" y="451" text-anchor="end" fill="#475569">KSh 920 K</text>

      <rect x="1050" y="470" width="12" height="12" rx="2" fill="#3478f6"/>
      <text x="1070" y="481">Card</text>
      <text x="1228" y="481" text-anchor="end" fill="#475569">KSh 460 K</text>
    </g>
    <text x="1050" y="520" font-size="15" font-weight="600" fill="#0f172a">Top Category</text>
    <text x="1050" y="545" font-size="13" fill="#334155">Beverages</text>
    <text x="1228" y="545" font-size="13" text-anchor="end" fill="#0f172a" font-weight="600">KSh 880 K</text>
    <text x="1050" y="570" font-size="13" fill="#334155">Bakery</text>
    <text x="1228" y="570" font-size="13" text-anchor="end" fill="#0f172a" font-weight="600">KSh 520 K</text>
    <text x="1050" y="595" font-size="13" fill="#334155">Groceries</text>
    <text x="1228" y="595" font-size="13" text-anchor="end" fill="#0f172a" font-weight="600">KSh 480 K</text>
  </g>

  <!-- Footer / pagination -->
  <g filter="url(#shadow-rpt)">
    <rect x="248" y="636" width="1000" height="44" rx="14" fill="#ffffff"/>
    <text x="276" y="664" font-size="13" fill="#64748b">Showing 1–20 of 8,420 records</text>
    <rect x="1080" y="648" width="30" height="22" rx="6" fill="#f1f5f9"/>
    <text x="1095" y="664" font-size="13" fill="#475569" text-anchor="middle">‹</text>
    <rect x="1118" y="648" width="30" height="22" rx="6" fill="#3478f6"/>
    <text x="1133" y="664" font-size="13" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="1156" y="648" width="30" height="22" rx="6" fill="#f1f5f9"/>
    <text x="1171" y="664" font-size="13" fill="#475569" text-anchor="middle">2</text>
    <rect x="1194" y="648" width="30" height="22" rx="6" fill="#f1f5f9"/>
    <text x="1209" y="664" font-size="13" fill="#475569" text-anchor="middle">3</text>
    <rect x="1232" y="648" width="30" height="22" rx="6" fill="#f1f5f9"/>
    <text x="1247" y="664" font-size="13" fill="#475569" text-anchor="middle">›</text>
  </g>
</svg>
