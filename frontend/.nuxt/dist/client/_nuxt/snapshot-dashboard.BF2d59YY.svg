<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f3f3"/><stop offset="1" stop-color="#e8edf4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3478f6"/><stop offset="1" stop-color="#1a5fd0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="720" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="34" cy="40" r="16" fill="#3478f6"/>
  <rect x="58" y="34" width="90" height="14" rx="7" fill="#1a1a1a"/>
  <g font-size="14" fill="#444">
    <rect x="16" y="85" width="188" height="42" rx="10" fill="#e8f1fe"/>
    <circle cx="40" cy="106" r="8" fill="#3478f6"/>
    <text x="62" y="111">Dashboard</text>
    <text x="40" y="160">POS</text>
    <text x="40" y="205">Inventory</text>
    <text x="40" y="250">Products</text>
    <text x="40" y="295">Customers</text>
    <text x="40" y="340">Suppliers</text>
    <text x="40" y="385">Reports</text>
    <text x="40" y="430">Analytics</text>
    <text x="40" y="475">Staff</text>
    <text x="40" y="520">Settings</text>
  </g>

  <!-- Topbar -->
  <rect x="220" y="0" width="1060" height="64" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Title -->
  <text x="248" y="108" font-size="28" font-weight="700" fill="#0f172a">Dashboard</text>
  <text x="248" y="135" font-size="15" fill="#64748b">Tuesday, Jan 6, 2026 · All Branches</text>

  <!-- KPI Cards -->
  <g filter="url(#shadow)">
    <rect x="248" y="160" width="240" height="118" rx="18" fill="#ffffff"/>
    <text x="276" y="195" font-size="14" fill="#64748b">Today's Revenue</text>
    <text x="276" y="240" font-size="30" font-weight="700" fill="#0f172a">KSh 84,250</text>
    <rect x="276" y="252" width="60" height="12" rx="6" fill="#dcfce7"/>
    <text x="342" y="262" font-size="11" fill="#16a34a">+12.4%</text>

    <rect x="508" y="160" width="240" height="118" rx="18" fill="#ffffff"/>
    <text x="536" y="195" font-size="14" fill="#64748b">Transactions</text>
    <text x="536" y="240" font-size="30" font-weight="700" fill="#0f172a">348</text>
    <rect x="536" y="252" width="60" height="12" rx="6" fill="#dcfce7"/>
    <text x="602" y="262" font-size="11" fill="#16a34a">+5.1%</text>

    <rect x="768" y="160" width="240" height="118" rx="18" fill="#ffffff"/>
    <text x="796" y="195" font-size="14" fill="#64748b">Avg. Order</text>
    <text x="796" y="240" font-size="30" font-weight="700" fill="#0f172a">KSh 242</text>
    <rect x="796" y="252" width="60" height="12" rx="6" fill="#fee2e2"/>
    <text x="862" y="262" font-size="11" fill="#dc2626">-2.3%</text>

    <rect x="1028" y="160" width="220" height="118" rx="18" fill="#ffffff"/>
    <text x="1056" y="195" font-size="14" fill="#64748b">Low Stock</text>
    <text x="1056" y="240" font-size="30" font-weight="700" fill="#0f172a">17 items</text>
    <rect x="1056" y="252" width="60" height="12" rx="6" fill="#fef3c7"/>
    <text x="1122" y="262" font-size="11" fill="#d97706">Action</text>
  </g>

  <!-- Chart Card -->
  <g filter="url(#shadow)">
    <rect x="248" y="305" width="760" height="245" rx="18" fill="#ffffff"/>
    <text x="280" y="340" font-size="18" font-weight="600" fill="#0f172a">Revenue Overview</text>
    <text x="280" y="362" font-size="13" fill="#64748b">Daily revenue for the past 7 days</text>
    <!-- Y axis grid -->
    <g stroke="#e2e8f0" stroke-dasharray="4 4">
      <line x1="300" y1="400" x2="970" y2="400"/>
      <line x1="300" y1="450" x2="970" y2="450"/>
      <line x1="300" y1="500" x2="970" y2="500"/>
    </g>
    <!-- Bars -->
    <g fill="url(#bar)">
      <rect x="315" y="440" width="60" height="90" rx="6"/>
      <rect x="410" y="415" width="60" height="115" rx="6"/>
      <rect x="505" y="465" width="60" height="65" rx="6"/>
      <rect x="600" y="395" width="60" height="135" rx="6"/>
      <rect x="695" y="425" width="60" height="105" rx="6"/>
      <rect x="790" y="380" width="60" height="150" rx="6"/>
      <rect x="885" y="405" width="60" height="125" rx="6"/>
    </g>
    <g font-size="11" fill="#64748b" text-anchor="middle">
      <text x="345" y="530">Mon</text><text x="440" y="530">Tue</text><text x="535" y="530">Wed</text>
      <text x="630" y="530">Thu</text><text x="725" y="530">Fri</text><text x="820" y="530">Sat</text><text x="915" y="530">Sun</text>
    </g>
  </g>

  <!-- Right side card -->
  <g filter="url(#shadow)">
    <rect x="1028" y="305" width="220" height="245" rx="18" fill="#ffffff"/>
    <text x="1050" y="340" font-size="16" font-weight="600" fill="#0f172a">Top Products</text>
    <g font-size="13" fill="#334155">
      <text x="1050" y="380">1. Coca-Cola 500ml</text>
      <text x="1050" y="412">2. Bread loaf</text>
      <text x="1050" y="444">3. Milk 1L</text>
      <text x="1050" y="476">4. Sugar 1kg</text>
      <text x="1050" y="508">5. Rice 2kg</text>
    </g>
    <g font-size="12" fill="#64748b" text-anchor="end">
      <text x="1220" y="380">KSh 12 K</text>
      <text x="1220" y="412">KSh 9.4 K</text>
      <text x="1220" y="444">KSh 8.1 K</text>
      <text x="1220" y="476">KSh 7.2 K</text>
      <text x="1220" y="508">KSh 6.5 K</text>
    </g>
  </g>

  <!-- Recent Transactions -->
  <g filter="url(#shadow)">
    <rect x="248" y="575" width="1000" height="120" rx="18" fill="#ffffff"/>
    <text x="280" y="610" font-size="16" font-weight="600" fill="#0f172a">Recent Transactions</text>
    <g font-size="13" fill="#334155">
      <rect x="280" y="625" width="940" height="24" rx="6" fill="#f8fafc"/>
      <text x="296" y="642">#1024 · John M.</text>
      <text x="500" y="642">3 items</text>
      <text x="700" y="642">M-Pesa</text>
      <text x="880" y="642" fill="#16a34a">Completed</text>
      <text x="1140" y="642" text-anchor="end">KSh 1,250</text>
    </g>
    <g font-size="13" fill="#334155">
      <rect x="280" y="649" width="940" height="24" rx="6" fill="#ffffff"/>
      <text x="296" y="666">#1023 · Sarah K.</text>
      <text x="500" y="666">1 item</text>
      <text x="700" y="666">Cash</text>
      <text x="880" y="666" fill="#16a34a">Completed</text>
      <text x="1140" y="666" text-anchor="end">KSh 320</text>
    </g>
  </g>
</svg>
