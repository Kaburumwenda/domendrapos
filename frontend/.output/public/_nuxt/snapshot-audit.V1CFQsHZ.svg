<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg-log" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f3f3"/><stop offset="1" stop-color="#e8edf4"/>
    </linearGradient>
    <filter id="shadow-log"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg-log)"/>

  <!-- Topbar -->
  <rect x="220" y="0" width="1060" height="64" fill="#ffffff" filter="url(#shadow-log)"/>

