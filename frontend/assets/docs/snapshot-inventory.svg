<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg-inv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f3f3"/><stop offset="1" stop-color="#e8edf4"/>
    </linearGradient>
    <filter id="shadow-inv"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg-inv)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="720" fill="#ffffff" filter="url(#shadow-inv)"/>
  <circle cx="34" cy="40" r="16" fill="#3478f6"/>
  <rect x="58" y="34" width="90" height="14" rx="7" fill="#1a1a1a"/>
  <g font-size="14" fill="#444">
    <rect x="16" y="125" width="188" height="42" rx="10" fill="#e8f1fe"/>
    <circle cx="40" cy="146" r="8" fill="#3478f6"/><text x="62" y="151">Inventory</text>
    <text x="40" y="205">Stock On Hand</text>
    <text x="40" y="250">Adjustments</text>
    <text x="40" y="295">Transfers</text>
    <text x="40" y="340">ABC Analysis</text>
    <text x="40" y="385">Low Stock Alerts</text>
  </g>

  <!-- Topbar -->
  <rect x="220" y="0" width="1060" height="64" fill="#ffffff" filter="url(#shadow-inv)"/>

  <!-- Title + KPI -->
  <text x="248" y="108" font-size="28" font-weight="700" fill="#0f172a">Inventory</text>
  <text x="248" y="135" font-size="15" fill="#64748b">Stock On Hand · City Branch</text>

  <g filter="url(#shadow-inv)">
    <rect x="248" y="160" width="252" height="100" rx="16" fill="#ffffff"/>
    <text x="268" y="190" font-size="13" fill="#64748b">Total Stock Value</text>
    <text x="268" y="225" font-size="24" font-weight="700" fill="#0f172a">KSh 2.4 M</text>

    <rect x="520" y="160" width="252" height="100" rx="16" fill="#ffffff"/>
    <text x="540" y="190" font-size="13" fill="#64748b">Active SKUs</text>
    <text x="540" y="225" font-size="24" font-weight="700" fill="#0f172a">1,248</text>

    <rect x="792" y="160" width="252" height="100" rx="16" fill="#ffffff"/>
    <text x="812" y="190" font-size="13" fill="#64748b">Low Stock Items</text>
    <text x="812" y="225" font-size="24" font-weight="700" fill="#dc2626">17</text>

    <rect x="1064" y="160" width="184" height="100" rx="16" fill="#ffffff"/>
    <text x="1084" y="190" font-size="13" fill="#64748b">Out of Stock</text>
    <text x="1084" y="225" font-size="24" font-weight="700" fill="#dc2626">5</text>
  </g>

  <!-- Toolbar -->
  <g filter="url(#shadow-inv)">
    <rect x="248" y="285" width="1000" height="60" rx="16" fill="#ffffff"/>
    <rect x="268" y="300" width="240" height="30" rx="8" fill="#f1f5f9"/>
    <text x="282" y="320" font-size="13" fill="#94a3b8">Search by name, SKU, barcode...</text>
    <rect x="520" y="300" width="160" height="30" rx="8" fill="#f1f5f9"/>
    <text x="534" y="320" font-size="13" fill="#64748b">Category: All</text>
    <rect x="692" y="300" width="140" height="30" rx="8" fill="#f1f5f9"/>
    <text x="706" y="320" font-size="13" fill="#64748b">Status: All</text>
    <rect x="844" y="300" width="160" height="30" rx="8" fill="#f1f5f9"/>
    <text x="858" y="320" font-size="13" fill="#64748b">Branch: City</text>
    <rect x="1150" y="300" width="86" height="30" rx="8" fill="#3478f6"/>
    <text x="1193" y="320" font-size="13" fill="#ffffff" text-anchor="middle">Export</text>
  </g>

  <!-- Table -->
  <g filter="url(#shadow-inv)">
    <rect x="248" y="365" width="1000" height="310" rx="16" fill="#ffffff"/>
    <!-- header -->
    <rect x="248" y="365" width="1000" height="44" rx="16" fill="#f8fafc"/>
    <g font-size="13" font-weight="600" fill="#475569">
      <text x="268" y="393">SKU</text>
      <text x="370" y="393">Product Name</text>
      <text x="580" y="393">Category</text>
      <text x="720" y="393">On Hand</text>
      <text x="810" y="393">Unit</text>
      <text x="880" y="393">Reorder</text>
      <text x="960" y="393">Value</text>
      <text x="1100" y="393">Status</text>
    </g>
    <line x1="268" y1="409" x2="1228" y2="409" stroke="#e2e8f0"/>

    <!-- rows -->
    <g font-size="13" fill="#334155">
      <text x="268" y="435">SKU-001</text>
      <text x="370" y="435">Coca-Cola 500ml</text>
      <text x="580" y="435">Beverages</text>
      <text x="720" y="435">240</text>
      <text x="810" y="435">bottle</text>
      <text x="880" y="435">50</text>
      <text x="960" y="435">KSh 14,400</text>
      <rect x="1095" y="424" width="80" height="22" rx="11" fill="#dcfce7"/>
      <text x="1135" y="439" font-size="11" fill="#16a34a" text-anchor="middle">In Stock</text>
      <line x1="268" y1="451" x2="1228" y2="451" stroke="#f1f5f9"/>

      <text x="268" y="477">SKU-002</text>
      <text x="370" y="477">Bread Loaf</text>
      <text x="580" y="477">Bakery</text>
      <text x="720" y="477">42</text>
      <text x="810" y="477">loaf</text>
      <text x="880" y="477">20</text>
      <text x="960" y="477">KSh 2,310</text>
      <rect x="1095" y="466" width="80" height="22" rx="11" fill="#dcfce7"/>
      <text x="1135" y="481" font-size="11" fill="#16a34a" text-anchor="middle">In Stock</text>
      <line x1="268" y1="493" x2="1228" y2="493" stroke="#f1f5f9"/>

      <text x="268" y="519">SKU-003</text>
      <text x="370" y="519">Milk 1L</text>
      <text x="580" y="519">Dairy</text>
      <text x="720" y="519">18</text>
      <text x="810" y="519">carton</text>
      <text x="880" y="519">25</text>
      <text x="960" y="519">KSh 2,160</text>
      <rect x="1095" y="508" width="80" height="22" rx="11" fill="#fef3c7"/>
      <text x="1135" y="523" font-size="11" fill="#d97706" text-anchor="middle">Low Stock</text>
      <line x1="268" y1="535" x2="1228" y2="535" stroke="#f1f5f9"/>

      <text x="268" y="561">SKU-004</text>
      <text x="370" y="561">Sugar 1kg</text>
      <text x="580" y="561">Groceries</text>
      <text x="720" y="561">87</text>
      <text x="810" y="561">bag</text>
      <text x="880" y="561">30</text>
      <text x="960" y="561">KSh 18,270</text>
      <rect x="1095" y="550" width="80" height="22" rx="11" fill="#dcfce7"/>
      <text x="1135" y="565" font-size="11" fill="#16a34a" text-anchor="middle">In Stock</text>
      <line x1="268" y1="577" x2="1228" y2="577" stroke="#f1f5f9"/>

      <text x="268" y="603">SKU-005</text>
      <text x="370" y="603">Eggs (tray)</text>
      <text x="580" y="603">Dairy</text>
      <text x="720" y="603">0</text>
      <text x="810" y="603">tray</text>
      <text x="880" y="603">10</text>
      <text x="960" y="603">KSh 0</text>
      <rect x="1095" y="592" width="80" height="22" rx="11" fill="#fee2e2"/>
      <text x="1135" y="607" font-size="11" fill="#dc2626" text-anchor="middle">Out of Stock</text>
      <line x1="268" y1="619" x2="1228" y2="619" stroke="#f1f5f9"/>

      <text x="268" y="645">SKU-006</text>
      <text x="370" y="645">Rice 2kg</text>
      <text x="580" y="645">Groceries</text>
      <text x="720" y="645">56</text>
      <text x="810" y="645">bag</text>
      <text x="880" y="645">20</text>
      <text x="960" y="645">KSh 19,040</text>
      <rect x="1095" y="634" width="80" height="22" rx="11" fill="#dcfce7"/>
      <text x="1135" y="649" font-size="11" fill="#16a34a" text-anchor="middle">In Stock</text>
    </g>
  </g>
</svg>
